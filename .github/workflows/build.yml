name: Build OfferWatch APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Write project files
        run: |
          mkdir -p app/src/main/java/com/offerwatch
          mkdir -p app/src/main/res/xml

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'OfferWatch'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.offerwatch'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.offerwatch.two'
                  minSdk 26
                  targetSdk 34
                  versionCode 7
                  versionName '0.7'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="OfferWatch 2"
                  android:theme="@android:style/Theme.Material.Light">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".OfferService"
                      android:exported="true"
                      android:label="OfferWatch 2"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagIncludeNotImportantViews|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:isAccessibilityTool="true"
              android:notificationTimeout="100" />
          EOF

          cat > app/src/main/java/com/offerwatch/OfferService.java <<'EOF'
          package com.offerwatch;

          import android.accessibilityservice.AccessibilityService;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.PixelFormat;
          import android.graphics.Typeface;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowManager;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          import android.view.accessibility.AccessibilityWindowInfo;
          import android.widget.FrameLayout;
          import android.widget.TextView;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Date;
          import java.util.List;
          import java.util.Locale;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class OfferService extends AccessibilityService {
              static final String FILE = "captures.txt";
              static final String BOLT = "ee.mtakso.driver";
              static final Pattern MONEY = Pattern.compile("R\\s*([0-9][0-9 ,.]*)");
              static final Pattern LEG = Pattern.compile("(\\d+)\\s*min\\D+([0-9.,]+)\\s*km");
              static OfferService inst;

              // ---- AVOID LISTS: add new places here, one per line, lowercase, in quotes ----
              // Purple corner when the PICKUP address contains any of these:
              static final String[] AVOID_PICKUP = {
                      "yeoville",
                      "hillbrow",
                      "berea",
                      "johannesburg cbd", "joburg cbd", "jozi cbd", "johannesburg central",
                      "reiger park", "riegerpark",
                      "eldorado park", "eldoradopark",
                      "riverlea",
                      "marshalltown",
                      "ferreirasdorp",
                      "newtown",
                      "fordsburg",
                      "doornfontein",
                      "jeppestown",
                      "bertrams",
                      "troyeville",
                      "braamfontein",
                      "joubert park",
                      "selby",
                      "vrededorp",
                      "pageview",
                      "wemmer",
                      "bellevue",
                      "bez valley",
                      "malvern",
                      "booysens",
                      "mayfair",
                      "brixton"
              };
              // Whole banner turns purple when pickup OR drop-off contains any of these:
              static final String[] AVOID_BOTH = {
                      "alexandra"
              };

              // ---- SHORT TRIP RULE (total km = pickup + trip) ----
              static final double SHORT_KM = 6.0;              // trips this short or shorter get the stricter test
              static final double SHORT_DECLINE_PROFIT = 12.0; // profit below this = DECLINE
              static final double SHORT_ACCEPT_PROFIT = 20.0;  // profit needed for ACCEPT
              static final double SHORT_ACCEPT_PERKM = 6.5;    // R per km needed for ACCEPT

              // Green corner (top-left) when the DROP-OFF address contains any of these (malls, hubs, busy places
              // where a return trip is likely). Edit this list to match where YOU find return trips.
              static final String[] BUSY_DROP = {
                      "sandton city", "nelson mandela square", "sandton gate", "woodmead",
                      "rosebank mall", "the zone", "hyde park corner", "melrose arch",
                      "mall of africa", "eastgate", "westgate", "southgate", "cresta",
                      "fourways mall", "northgate", "clearwater mall", "greenstone",
                      "brightwater", "the glen", "killarney mall", "bruma lake",
                      "o.r. tambo", "or tambo", "o r tambo", "oliver tambo",
                      "gautrain", "park station",
                      "fourways", "morningside",
                      "home affairs", "department of", "sassa",
                      "sars branch", "sars office",
                      "traffic department", "licensing", "drivers licence", "driving licence",
                      "magistrate", "high court", "civic centre"
              };

              static String match(String text, String[] list) {
                  if (text == null) return null;
                  // ignore street names such as 'Alexandra Street' so they don't count as the township
                  String t = text.toLowerCase(Locale.ROOT).replaceAll("alexandra\\s+(street|st|road|rd|avenue|ave|drive|dr|lane|ln|crescent|close|way)\\b", " ");
                  for (String s : list) {
                      if (t.contains(s)) return s;
                  }
                  return null;
              }

              static class CornerView extends View {
                  final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  final Path path = new Path();
                  final int color;
                  final boolean left;

                  CornerView(Context c, int color, boolean left) {
                      super(c);
                      this.color = color;
                      this.left = left;
                  }

                  @Override
                  protected void onDraw(Canvas c) {
                      int w = getWidth();
                      int hh = getHeight();
                      path.reset();
                      if (left) {
                          path.moveTo(0, 0);
                          path.lineTo(w, 0);
                          path.lineTo(0, hh);
                      } else {
                          path.moveTo(0, 0);
                          path.lineTo(w, 0);
                          path.lineTo(w, hh);
                      }
                      path.close();
                      p.setStyle(Paint.Style.FILL);
                      p.setColor(color);
                      c.drawPath(path, p);
                  }
              }

              final Handler h = new Handler(Looper.getMainLooper());
              final Runnable hideTask = new Runnable() {
                  @Override
                  public void run() {
                      hideBanner();
                  }
              };
              WindowManager wm;
              FrameLayout banner;
              TextView bannerText;
              CornerView corner;
              CornerView cornerBusy;
              long lastRun = 0;
              String lastKey = "";
              String lastUnparsed = "";

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  inst = this;
              }

              @Override
              public void onDestroy() {
                  inst = null;
                  hideBanner();
                  super.onDestroy();
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent e) {
                  if (e.getPackageName() == null) return;
                  if (!BOLT.equals(e.getPackageName().toString())) return;
                  long now = System.currentTimeMillis();
                  if (now - lastRun < 300) return;
                  lastRun = now;
                  AccessibilityNodeInfo root = findRoot(e);
                  if (root == null) return;
                  List<String[]> nodes = new ArrayList<>();
                  collect(root, nodes, 0);
                  if (nodes.isEmpty()) return;
                  handle(nodes);
              }

              void handle(List<String[]> nodes) {
                  String fareText = null;
                  boolean isOffer = false;
                  List<String> legs = new ArrayList<>();
                  List<String> places = new ArrayList<>();
                  StringBuilder dump = new StringBuilder();
                  for (String[] n : nodes) {
                      String t = n[0];
                      String id = n[1];
                      dump.append(t).append(" | ").append(id).append("\n");
                      if (id.endsWith(":id/tripInfo")) fareText = t;
                      else if (id.endsWith(":id/routeTitle")) legs.add(t);
                      else if (id.endsWith(":id/routeSubtitle")) places.add(t);
                      else if (id.endsWith(":id/buttonDecline")) isOffer = true;
                  }
                  if (!isOffer) {
                      if (banner != null && nodes.size() >= 5) hideBanner();
                      return;
                  }
                  double fare = -1;
                  if (fareText != null) {
                      Matcher m = MONEY.matcher(fareText);
                      if (m.find()) {
                          try {
                              fare = Double.parseDouble(m.group(1).replace(",", "").replace(" ", ""));
                          } catch (Exception ex) {
                              fare = -1;
                          }
                      }
                  }
                  List<Double> kms = new ArrayList<>();
                  double mins = 0;
                  for (String l : legs) {
                      Matcher m = LEG.matcher(l);
                      if (m.find()) {
                          try {
                              mins += Double.parseDouble(m.group(1));
                              kms.add(Double.parseDouble(m.group(2).replace(",", ".")));
                          } catch (Exception ex) {
                              // skip this line
                          }
                      }
                  }
                  if (fare < 0 || kms.size() < 2) {
                      String d = dump.toString();
                      if (!d.equals(lastUnparsed)) {
                          lastUnparsed = d;
                          save("UNPARSED OFFER", d);
                      }
                      return;
                  }
                  double pick = kms.get(0);
                  double trip = kms.get(kms.size() - 1);
                  double total = pick + trip;
                  if (total <= 0) return;
                  SharedPreferences sp = getSharedPreferences("ow", MODE_PRIVATE);
                  double floor = sp.getFloat("floor", 4.0f);
                  double goal = sp.getFloat("goal", 5.5f);
                  double cost = sp.getFloat("cost", 2.5f);
                  double perKm = fare / total;
                  double profit = fare - total * cost;
                  // Places come in order from the screen: first = pickup, second = drop-off
                  String avoidName = null;
                  for (String pl : places) {
                      String m = match(pl, AVOID_BOTH);
                      if (m != null) avoidName = m;
                  }
                  boolean avoid = avoidName != null;
                  boolean cornerOn = !places.isEmpty() && match(places.get(0), AVOID_PICKUP) != null;
                  String pickAddr = places.isEmpty() ? "" : places.get(0);
                  String dropAddr = places.size() > 1 ? places.get(1) : "";
                  boolean busyDrop = match(dropAddr, BUSY_DROP) != null;
                  String verdict;
                  int bg;
                  int fg = Color.WHITE;
                  if (avoid) {
                      verdict = "AVOID - " + avoidName.substring(0, 1).toUpperCase(Locale.ROOT) + avoidName.substring(1);
                      bg = 0xEE6A1B9A;
                  } else if (perKm < floor || profit < 0) {
                      verdict = "DECLINE";
                      bg = 0xEEC62828;
                  } else if (total <= SHORT_KM && profit < SHORT_DECLINE_PROFIT) {
                      verdict = "DECLINE";
                      bg = 0xEEC62828;
                  } else if (total <= SHORT_KM && (profit < SHORT_ACCEPT_PROFIT || perKm < SHORT_ACCEPT_PERKM)) {
                      verdict = "BORDERLINE";
                      bg = 0xEEF9A825;
                      fg = Color.BLACK;
                  } else if (perKm >= goal) {
                      verdict = "ACCEPT";
                      bg = 0xEE2E7D32;
                  } else {
                      verdict = "BORDERLINE";
                      bg = 0xEEF9A825;
                      fg = Color.BLACK;
                  }
                  String l2 = String.format(Locale.US, "R%.2f | %.1f km total | R%.2f/km", fare, total, perKm);
                  String l3 = String.format(Locale.US, "Pickup %.1f km | profit about R%.0f", pick, profit);
                  if (mins > 0) {
                      l3 += String.format(Locale.US, " (R%.0f/h)", profit / (mins / 60.0));
                  }
                  String l4 = "";
                  if (!busyDrop && trip >= 10.0) {
                      double worst = profit - trip * cost;
                      l4 = String.format(Locale.US, "Not a busy drop-off. If return is empty: profit about R%.0f", worst);
                  }
                  String key = verdict + l2 + l3 + l4 + cornerOn + busyDrop;
                  if (key.equals(lastKey) && banner != null) {
                      h.removeCallbacks(hideTask);
                      h.postDelayed(hideTask, 20000);
                      return;
                  }
                  lastKey = key;
                  showBanner(verdict + "\n" + l2 + "\n" + l3 + (l4.isEmpty() ? "" : "\n" + l4), bg, fg, cornerOn, busyDrop);
                  save("OFFER", l2 + " | " + l3 + " -> " + verdict + (cornerOn ? " [PURPLE CORNER]" : "")
                          + (busyDrop ? " [GREEN CORNER busy drop-off]" : "") + "\nPICKUP: " + pickAddr + "\nDROP-OFF: " + dropAddr);
              }

              void showBanner(String text, int bg, int fg, boolean showCorner, boolean showBusy) {
                  try {
                      if (wm == null) wm = (WindowManager) getSystemService(Context.WINDOW_SERVICE);
                      if (banner == null) {
                          float d = getResources().getDisplayMetrics().density;
                          FrameLayout fl = new FrameLayout(this);
                          TextView tv = new TextView(this);
                          tv.setGravity(Gravity.CENTER);
                          tv.setTypeface(null, Typeface.BOLD);
                          tv.setTextSize(20);
                          tv.setPadding((int) (12 * d), (int) (36 * d), (int) (12 * d), (int) (12 * d));
                          fl.addView(tv, new FrameLayout.LayoutParams(
                                  FrameLayout.LayoutParams.MATCH_PARENT,
                                  FrameLayout.LayoutParams.WRAP_CONTENT));
                          CornerView cv = new CornerView(this, 0xFFAA00FF, false);
                          int size = (int) (56 * d);
                          FrameLayout.LayoutParams clp = new FrameLayout.LayoutParams(size, size);
                          clp.gravity = Gravity.TOP | Gravity.END;
                          fl.addView(cv, clp);
                          CornerView cb = new CornerView(this, 0xFF00E676, true);
                          FrameLayout.LayoutParams blp = new FrameLayout.LayoutParams(size, size);
                          blp.gravity = Gravity.TOP | Gravity.START;
                          fl.addView(cb, blp);
                          WindowManager.LayoutParams lp = new WindowManager.LayoutParams(
                                  WindowManager.LayoutParams.MATCH_PARENT,
                                  WindowManager.LayoutParams.WRAP_CONTENT,
                                  WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                                  WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                          | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                                          | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                                  PixelFormat.TRANSLUCENT);
                          lp.gravity = Gravity.TOP;
                          wm.addView(fl, lp);
                          banner = fl;
                          bannerText = tv;
                          corner = cv;
                          cornerBusy = cb;
                      }
                      bannerText.setText(text);
                      bannerText.setBackgroundColor(bg);
                      bannerText.setTextColor(fg);
                      corner.setVisibility(showCorner ? View.VISIBLE : View.GONE);
                      cornerBusy.setVisibility(showBusy ? View.VISIBLE : View.GONE);
                      h.removeCallbacks(hideTask);
                      h.postDelayed(hideTask, 20000);
                  } catch (Exception ex) {
                      banner = null;
                  }
              }

              void hideBanner() {
                  try {
                      if (banner != null && wm != null) wm.removeView(banner);
                  } catch (Exception ex) {
                      // ignore
                  }
                  banner = null;
                  lastKey = "";
                  h.removeCallbacks(hideTask);
              }

              void demo() {
                  lastKey = "";
                  showBanner("ACCEPT (test)\nR45.00 | 6.0 km total | R7.50/km\nPickup 1.0 km | profit about R30",
                          0xEE2E7D32, Color.WHITE, true, true);
                  h.removeCallbacks(hideTask);
                  h.postDelayed(hideTask, 6000);
              }

              AccessibilityNodeInfo findRoot(AccessibilityEvent e) {
                  AccessibilityNodeInfo r = getRootInActiveWindow();
                  if (r != null && BOLT.equals(String.valueOf(r.getPackageName()))) return r;
                  List<AccessibilityWindowInfo> ws = getWindows();
                  if (ws != null) {
                      for (AccessibilityWindowInfo w : ws) {
                          AccessibilityNodeInfo wr = w.getRoot();
                          if (wr != null && BOLT.equals(String.valueOf(wr.getPackageName()))) return wr;
                      }
                  }
                  return e.getSource();
              }

              void collect(AccessibilityNodeInfo n, List<String[]> out, int d) {
                  if (n == null || d > 40) return;
                  CharSequence tx = n.getText();
                  String id = n.getViewIdResourceName();
                  if (tx != null && tx.length() > 0) {
                      out.add(new String[]{tx.toString(), id == null ? "" : id});
                  }
                  for (int i = 0; i < n.getChildCount(); i++) {
                      collect(n.getChild(i), out, d + 1);
                  }
              }

              void save(String tag, String text) {
                  try {
                      File f = new File(getFilesDir(), FILE);
                      String old = read(f);
                      String stamp = new SimpleDateFormat("HH:mm:ss", Locale.US).format(new Date());
                      String all = "=== " + stamp + " " + tag + "\n" + text + "\n" + old;
                      if (all.length() > 40000) all = all.substring(0, 40000);
                      FileOutputStream out = new FileOutputStream(f);
                      out.write(all.getBytes("UTF-8"));
                      out.close();
                  } catch (Exception ex) {
                      // ignore
                  }
              }

              static String read(File f) {
                  try {
                      if (!f.exists()) return "";
                      FileInputStream in = new FileInputStream(f);
                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      byte[] buf = new byte[4096];
                      int r;
                      while ((r = in.read(buf)) > 0) bo.write(buf, 0, r);
                      in.close();
                      return bo.toString("UTF-8");
                  } catch (Exception ex) {
                      return "";
                  }
              }

              @Override
              public void onInterrupt() {}
          }
          EOF

          cat > app/src/main/java/com/offerwatch/MainActivity.java <<'EOF'
          package com.offerwatch;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.text.InputType;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.io.File;

          public class MainActivity extends Activity {
              TextView status;
              TextView dump;
              EditText fFloor;
              EditText fGoal;
              EditText fCost;
              SharedPreferences sp;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  sp = getSharedPreferences("ow", MODE_PRIVATE);
                  int p = (int) (16 * getResources().getDisplayMetrics().density);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(p, p * 2, p, p);
                  status = new TextView(this);
                  status.setTextSize(18);
                  root.addView(status);
                  root.addView(btn("Open accessibility settings", v ->
                          startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))));
                  root.addView(btn("Test banner", v -> {
                      if (OfferService.inst != null) {
                          OfferService.inst.demo();
                      } else {
                          Toast.makeText(this, "Service is off", Toast.LENGTH_SHORT).show();
                      }
                  }));
                  fFloor = num(root, "Decline below (R per km, Bolt fare is already net)", "floor", 4.0f);
                  fGoal = num(root, "Accept from (R per km)", "goal", 5.5f);
                  fCost = num(root, "Running cost (R per km)", "cost", 2.5f);
                  root.addView(btn("Save settings", v -> saveSettings()));
                  root.addView(btn("Refresh log", v -> refresh()));
                  root.addView(btn("Copy log", v -> copy()));
                  root.addView(btn("Clear log", v -> {
                      new File(getFilesDir(), OfferService.FILE).delete();
                      refresh();
                  }));
                  dump = new TextView(this);
                  dump.setTextIsSelectable(true);
                  dump.setTextSize(12);
                  root.addView(dump);
                  ScrollView sv = new ScrollView(this);
                  sv.addView(root);
                  setContentView(sv);
              }

              EditText num(LinearLayout root, String label, String key, float def) {
                  TextView l = new TextView(this);
                  l.setText(label);
                  root.addView(l);
                  EditText e = new EditText(this);
                  e.setInputType(InputType.TYPE_CLASS_NUMBER | InputType.TYPE_NUMBER_FLAG_DECIMAL);
                  e.setText(String.valueOf(sp.getFloat(key, def)));
                  root.addView(e);
                  return e;
              }

              Button btn(String t, View.OnClickListener l) {
                  Button x = new Button(this);
                  x.setText(t);
                  x.setOnClickListener(l);
                  return x;
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  refresh();
              }

              boolean enabled() {
                  String s = Settings.Secure.getString(getContentResolver(),
                          Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);
                  return s != null && s.contains(getPackageName() + "/");
              }

              String captures() {
                  return OfferService.read(new File(getFilesDir(), OfferService.FILE));
              }

              void refresh() {
                  status.setText(enabled()
                          ? "OfferWatch 2 v7. Service is ON. Open Bolt and go online. A colored banner shows on each request."
                          : "OfferWatch 2 v7. Service is OFF. Tap the button below, find OfferWatch 2 and turn it on.");
                  String t = captures();
                  dump.setText(t.isEmpty() ? "No offers logged yet." : t);
              }

              void saveSettings() {
                  try {
                      sp.edit()
                              .putFloat("floor", Float.parseFloat(fFloor.getText().toString()))
                              .putFloat("goal", Float.parseFloat(fGoal.getText().toString()))
                              .putFloat("cost", Float.parseFloat(fCost.getText().toString()))
                              .apply();
                      Toast.makeText(this, "Saved", Toast.LENGTH_SHORT).show();
                  } catch (Exception ex) {
                      Toast.makeText(this, "Enter numbers only", Toast.LENGTH_SHORT).show();
                  }
              }

              void copy() {
                  ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                  cm.setPrimaryClip(ClipData.newPlainText("log", captures()));
                  Toast.makeText(this, "Copied", Toast.LENGTH_SHORT).show();
              }
          }
          EOF

      - name: Build
        run: gradle assembleDebug --no-daemon

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: OfferWatch build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
