name: Build OfferWatch APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Write project files
        run: |
          mkdir -p app/src/main/java/com/offerwatch

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'OfferWatch'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.offerwatch'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.offerwatch'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '0.1'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="OfferWatch"
                  android:theme="@android:style/Theme.Material.Light">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".OfferService"
                      android:exported="true"
                      android:label="OfferWatch"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/offerwatch/OfferService.java <<'EOF'
          package com.offerwatch;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.AccessibilityServiceInfo;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          import android.widget.Toast;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          public class OfferService extends AccessibilityService {
              static final String FILE = "captures.txt";
              long lastRun = 0;
              String lastText = "";

              @Override
              protected void onServiceConnected() {
                  AccessibilityServiceInfo i = new AccessibilityServiceInfo();
                  i.eventTypes = AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED
                          | AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED;
                  i.feedbackType = AccessibilityServiceInfo.FEEDBACK_GENERIC;
                  i.flags = AccessibilityServiceInfo.FLAG_REPORT_VIEW_IDS
                          | AccessibilityServiceInfo.FLAG_INCLUDE_NOT_IMPORTANT_VIEWS;
                  i.notificationTimeout = 100;
                  setServiceInfo(i);
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent e) {
                  if (e.getPackageName() == null) return;
                  String p = e.getPackageName().toString();
                  if (!p.equals("ee.mtakso.driver") && !p.equals("com.ubercab.driver")) return;
                  long now = System.currentTimeMillis();
                  if (now - lastRun < 400) return;
                  lastRun = now;
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) root = e.getSource();
                  if (root == null) return;
                  StringBuilder sb = new StringBuilder();
                  walk(root, sb, 0);
                  String t = sb.toString();
                  if (!t.toLowerCase(Locale.ROOT).contains("km")) return;
                  if (t.equals(lastText)) return;
                  lastText = t;
                  save(p, t);
              }

              void walk(AccessibilityNodeInfo n, StringBuilder sb, int d) {
                  if (n == null || d > 40) return;
                  CharSequence tx = n.getText();
                  CharSequence cd = n.getContentDescription();
                  String id = n.getViewIdResourceName();
                  boolean hasTx = tx != null && tx.length() > 0;
                  boolean hasCd = cd != null && cd.length() > 0;
                  if (hasTx || hasCd) {
                      sb.append(hasTx ? tx : "").append(" | ")
                        .append(hasCd ? cd : "").append(" | ")
                        .append(id == null ? "" : id).append("\n");
                  }
                  for (int i = 0; i < n.getChildCount(); i++) {
                      walk(n.getChild(i), sb, d + 1);
                  }
              }

              void save(String pkg, String text) {
                  try {
                      File f = new File(getFilesDir(), FILE);
                      String old = read(f);
                      String stamp = new SimpleDateFormat("HH:mm:ss", Locale.US).format(new Date());
                      String all = "=== " + stamp + " " + pkg + "\n" + text + "\n" + old;
                      if (all.length() > 40000) all = all.substring(0, 40000);
                      FileOutputStream out = new FileOutputStream(f);
                      out.write(all.getBytes("UTF-8"));
                      out.close();
                      Toast.makeText(this, "OfferWatch captured a screen", Toast.LENGTH_SHORT).show();
                  } catch (Exception ex) {
                      // ignore
                  }
              }

              static String read(File f) {
                  try {
                      if (!f.exists()) return "";
                      FileInputStream in = new FileInputStream(f);
                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      byte[] buf = new byte[4096];
                      int r;
                      while ((r = in.read(buf)) > 0) bo.write(buf, 0, r);
                      in.close();
                      return bo.toString("UTF-8");
                  } catch (Exception ex) {
                      return "";
                  }
              }

              @Override
              public void onInterrupt() {}
          }
          EOF

          cat > app/src/main/java/com/offerwatch/MainActivity.java <<'EOF'
          package com.offerwatch;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.io.File;

          public class MainActivity extends Activity {
              TextView status;
              TextView dump;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  int p = (int) (16 * getResources().getDisplayMetrics().density);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(p, p * 2, p, p);
                  status = new TextView(this);
                  status.setTextSize(18);
                  root.addView(status);
                  root.addView(btn("Open accessibility settings", v ->
                          startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))));
                  root.addView(btn("Refresh", v -> refresh()));
                  root.addView(btn("Copy captures", v -> copy()));
                  root.addView(btn("Share captures", v -> share()));
                  root.addView(btn("Clear", v -> {
                      new File(getFilesDir(), OfferService.FILE).delete();
                      refresh();
                  }));
                  ScrollView sv = new ScrollView(this);
                  dump = new TextView(this);
                  dump.setTextIsSelectable(true);
                  dump.setTextSize(12);
                  sv.addView(dump);
                  root.addView(sv, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f));
                  setContentView(root);
              }

              Button btn(String t, View.OnClickListener l) {
                  Button x = new Button(this);
                  x.setText(t);
                  x.setOnClickListener(l);
                  return x;
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  refresh();
              }

              boolean enabled() {
                  String s = Settings.Secure.getString(getContentResolver(),
                          Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);
                  return s != null && s.contains(getPackageName() + "/");
              }

              String captures() {
                  return OfferService.read(new File(getFilesDir(), OfferService.FILE));
              }

              void refresh() {
                  status.setText(enabled()
                          ? "Service is ON. Open the Bolt driver app and wait for a ride request."
                          : "Service is OFF. Tap the button below, find OfferWatch and turn it on.");
                  String t = captures();
                  dump.setText(t.isEmpty() ? "No captures yet." : t);
              }

              void copy() {
                  ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                  cm.setPrimaryClip(ClipData.newPlainText("captures", captures()));
                  Toast.makeText(this, "Copied", Toast.LENGTH_SHORT).show();
              }

              void share() {
                  Intent i = new Intent(Intent.ACTION_SEND);
                  i.setType("text/plain");
                  i.putExtra(Intent.EXTRA_TEXT, captures());
                  startActivity(Intent.createChooser(i, "Share captures"));
              }
          }
          EOF

      - name: Build
        run: gradle assembleDebug --no-daemon

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: OfferWatch build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
